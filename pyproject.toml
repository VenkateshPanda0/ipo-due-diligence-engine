[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipo-due-diligence-engine"
version = "0.1.0"
description = "Deterministic regulatory decision engine for evaluating IPO eligibility under SEBI ICDR regulations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "IPO Due Diligence Engine Contributors" }]
keywords = ["IPO", "SEBI", "compliance", "fintech", "regulatory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.19",
    "jinja2>=3.1",
    "structlog>=24.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pytesseract>=0.3",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "factory-boy>=3.3",
    "polyfactory>=2.16",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
"Homepage" = "https://github.com/example/ipo-due-diligence-engine"
"Documentation" = "https://github.com/example/ipo-due-diligence-engine/blob/main/docs"
"Issues" = "https://github.com/example/ipo-due-diligence-engine/issues"

# ---------------------------------------------------------------------------
# Hatch build configuration
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = [
    "TC001",  # Pydantic runtime type resolution needs these imports available
    "TC003",  # Pydantic runtime type resolution needs these imports available
    "UP042",  # Project convention requires str, Enum for public API stability
    "UP046",  # Keep Pydantic generic model syntax compatible with current models
    "B008",  # FastAPI uses Depends/Query in function defaults by design
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]  # assert is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
exclude = ["backend/tests/", "scripts/"]

[[tool.mypy.overrides]]
module = [
    "camelot.*",
    "pdfplumber.*",
    "easyocr.*",
    "pytesseract.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests that run in isolation with no external dependencies",
    "integration: Integration tests that exercise multiple components together",
    "regression: Regression tests using golden datasets",
    "slow: Tests that take more than 1 second to run",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = [
    "backend/tests/*",
    "backend/app/parser/ai_extractor.py",  # requires live LLM API
]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80

[tool.coverage.paths]
source = ["backend/app"]
