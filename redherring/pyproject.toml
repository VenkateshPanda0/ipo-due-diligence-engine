[project]
name = "redherring"
version = "0.1.0"
description = "Forensic analysis of Indian IPO offer documents with page-level citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Venkatesh Panda", email = "166646817+VenkateshPanda0@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
]

[project.scripts]
rh = "redherring.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Real filings use en/figure dashes, Unicode minus and NBSP in numeric cells; parsers match them.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Strict where extraction logic will live (M1+); those packages are empty stubs in M0.
[[tool.mypy.overrides]]
module = ["redherring.extract.*", "redherring.verify.*", "redherring.flags.*"]
strict = true

# Untyped third-party PDF libraries.
[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
