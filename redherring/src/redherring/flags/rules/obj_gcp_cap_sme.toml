id = "OBJ-GCP-CAP-SME"
name = "General corporate purposes close to the regulatory cap (SME)"
rationale = "On the SME platform the unallocated general-purposes bucket is capped at the lesser of 15% of the raise or Rs 10 crore, so a figure near that cap is worth a look."
platforms = ["sme"]
severity = "medium"
heuristic = false
valid_from = 2025-03-08
citation_requirement = "Cite the objects-of-the-issue row for general corporate purposes and the row giving the amount being raised."

[logic]
kind = "ratio_vs_cap"
numerators = ["objects.gcp_amount"]
denominator = "issue.fresh_issue_amount"
cap = 0.15
abs_cap = 100000000.0
near_cap_fraction = 0.9

[[sources]]
kind = "regulation"
ref = "SEBI (Issue of Capital and Disclosure Requirements) Regulations, 2018, Chapter IX (SME issues)"
clause = "Regulation 230(2)"
url = "https://www.sebi.gov.in/sebi_data/attachdocs/mar-2026/1774592300989.pdf"
checked_on = 2026-10-24
effective = 2025-03-08
note = "Fifteen per cent of the amount being raised or Rs 10 crores, whichever is less; substituted w.e.f. 08.03.2025 for 'twenty five per cent' per the footnotes in SEBI's consolidated copy. Rs 10 crore = 100,000,000 rupees."
